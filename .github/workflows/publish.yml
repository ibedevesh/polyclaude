name: Publish to PyPI

# Auto-deploy: publishes to PyPI whenever you publish a GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:        # allow manual runs from the Actions tab too

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # matches the environment in your PyPI publisher config
    permissions:
      id-token: write          # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
